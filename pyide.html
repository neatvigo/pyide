<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>pyIDE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0f1117;
    --panel: #171a24;
    --panel-2: #1d2130;
    --border: #2a2f42;
    --text: #e7e9f0;
    --text-dim: #8790a8;
    --amber: #f2b134;
    --amber-dim: #a97e26;
    --mint: #5fd9a4;
    --error: #ff6b76;
    --gutter: #4a5170;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    display:flex; flex-direction:column;
    overflow:hidden;
    height:100vh;
    height:100dvh;
  }

  /* ---------- Header ---------- */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink:0;
  }
  .brand{ display:flex; align-items:baseline; gap:8px; }
  .brand .mark{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px; letter-spacing:-0.02em;
    color:var(--text);
  }
  .brand .mark span{ color:var(--amber); }
  .brand .sub{ font-size:10px; color:var(--text-dim); letter-spacing:0.06em; text-transform:uppercase; }
  .status{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text-dim); }
  .dot{ width:8px; height:8px; border-radius:50%; background:#565d78; transition:background .3s; }
  .dot.booting{ background: var(--amber); animation: pulse 1s infinite ease-in-out; }
  .dot.ready{ background: var(--mint); }
  .dot.running{ background: var(--amber); animation: pulse .6s infinite ease-in-out; }
  .dot.err{ background: var(--error); }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }

  /* ---------- Tabs ---------- */
  .tabs{ display:flex; background:var(--panel); border-bottom:1px solid var(--border); flex-shrink:0; }
  .tab{
    flex:1; text-align:center; padding:10px 0; font-size:12.5px; font-weight:600;
    color:var(--text-dim); letter-spacing:0.03em; position:relative; background:none; border:none;
    font-family:'Space Grotesk',sans-serif;
  }
  .tab.active{ color:var(--text); }
  .tab.active::after{
    content:''; position:absolute; left:20%; right:20%; bottom:0; height:2px; background:var(--amber);
  }
  .tab .badge{
    display:inline-block; margin-left:6px; width:6px; height:6px; border-radius:50%; background:var(--error);
    vertical-align:middle;
  }

  /* ---------- Main area ---------- */
  main{ flex:1; min-height:0; position:relative; }
  .pane{ position:absolute; inset:0; display:none; flex-direction:column; }
  .pane.active{ display:flex; }

  /* Editor */
  .editor-wrap{ flex:1; display:flex; min-height:0; background:var(--bg); }
  .gutter{
    width:38px; flex-shrink:0; text-align:right; padding:14px 8px 14px 0; color:var(--gutter);
    font-size:13px; line-height:20px; overflow:hidden; user-select:none; border-right:1px solid var(--border);
  }
  textarea#code{
    flex:1; resize:none; border:none; outline:none; background:var(--bg); color:var(--text);
    font-family:'JetBrains Mono',monospace; font-size:13px; line-height:20px; padding:14px 12px;
    white-space:pre; overflow:auto; -webkit-overflow-scrolling:touch;
  }

  /* Symbol toolbar */
  .symstrip{
    display:flex; gap:6px; overflow-x:auto; padding:8px 10px; background:var(--panel-2);
    border-top:1px solid var(--border); flex-shrink:0; -webkit-overflow-scrolling:touch;
  }
  .symstrip::-webkit-scrollbar{ display:none; }
  .sym{
    flex-shrink:0; background:var(--panel); border:1px solid var(--border); color:var(--text);
    font-family:'JetBrains Mono',monospace; font-size:13px; padding:8px 12px; border-radius:8px;
    white-space:nowrap;
  }
  .sym:active{ background:var(--amber-dim); border-color:var(--amber); }
  .sym.kw{ color:var(--mint); }

  /* Output */
  #output{
    flex:1; overflow-y:auto; padding:14px 14px 90px 14px; font-size:13px; line-height:1.55;
    white-space:pre-wrap; word-break:break-word; -webkit-overflow-scrolling:touch;
  }
  #output .placeholder{ color:var(--text-dim); }
  #output .line{ margin:0 0 2px 0; }
  #output .stdout{ color:var(--text); }
  #output .stderr{ color:var(--error); }
  #output .meta{ color:var(--text-dim); font-size:11px; margin:10px 0 4px 0; border-top:1px dashed var(--border); padding-top:8px; }

  /* ---------- Action bar ---------- */
  .actionbar{
    display:flex; gap:10px; padding:10px 14px calc(12px + env(safe-area-inset-bottom)) 14px;
    background:var(--panel); border-top:1px solid var(--border); flex-shrink:0;
  }
  button.btn{
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px; border:none; border-radius:10px;
    padding:13px 0; letter-spacing:0.01em;
  }
  .btn-run{
    flex:1; background:var(--amber); color:#1a1200; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-run:disabled{ background:#5b4d2c; color:#8c8368; }
  .btn-ghost{
    background:var(--panel-2); color:var(--text-dim); border:1px solid var(--border); padding:13px 16px;
  }
  .spinner{
    width:14px; height:14px; border-radius:50%; border:2px solid rgba(0,0,0,.25); border-top-color:#1a1200;
    animation: spin .7s linear infinite; display:none;
  }
  .spinner.on{ display:inline-block; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="mark">py<span>IDE</span></div>
    <div class="sub">pocket python</div>
  </div>
  <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">booting</span></div>
</header>

<div class="tabs">
  <button class="tab active" id="tabCodeBtn" onclick="showPane('code')">Code</button>
  <button class="tab" id="tabOutputBtn" onclick="showPane('output')">Output<span class="badge" id="outBadge" style="display:none;"></span></button>
</div>

<main>
  <div class="pane active" id="paneCode">
    <div class="editor-wrap">
      <div class="gutter" id="gutter">1</div>
      <textarea id="code" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
    </div>
    <div class="symstrip" id="symstrip"></div>
  </div>

  <div class="pane" id="paneOutput">
    <div id="output"><div class="placeholder">Run your code to see output here.</div></div>
  </div>
</main>

<div class="actionbar">
  <button class="btn btn-ghost" id="resetBtn" title="Reset to starter code">Reset</button>
  <button class="btn btn-run" id="runBtn" disabled>
    <span class="spinner" id="runSpinner"></span>
    <span id="runLabel">Loading runtime…</span>
  </button>
  <button class="btn btn-ghost" id="clearBtn">Clear</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pyodide/0.28.3/pyodide.js"></script>
<script>
  const STARTER = `# Welcome to pyIDE — Python in your pocket.
# Tap Run to execute. Use the strip above the keyboard
# for quick symbols like : ( ) [ ] { } and keywords.

def greet(name):
    return f"Hello, {name}!"

for n in ["world", "pyIDE"]:
    print(greet(n))
`;

  const codeEl = document.getElementById('code');
  const gutterEl = document.getElementById('gutter');
  const outputEl = document.getElementById('output');
  const runBtn = document.getElementById('runBtn');
  const runLabel = document.getElementById('runLabel');
  const runSpinner = document.getElementById('runSpinner');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const outBadge = document.getElementById('outBadge');

  // ---------- Symbol strip ----------
  const symbols = [
    {label:'Tab', insert:'    '},
    {label:':'}, {label:'()'}, {label:'[]'}, {label:'{}'},
    {label:'""'}, {label:"''"}, {label:'='}, {label:'==', kw:false},
    {label:'+'}, {label:'-'}, {label:'*'}, {label:'/'}, {label:'%'},
    {label:'#'}, {label:'_'},
    {label:'if ', kw:true}, {label:'elif ', kw:true}, {label:'else:', kw:true},
    {label:'for ', kw:true}, {label:'while ', kw:true},
    {label:'def ', kw:true}, {label:'return ', kw:true},
    {label:'print()', kw:true}, {label:'import ', kw:true},
    {label:'True', kw:true}, {label:'False', kw:true}, {label:'None', kw:true},
    {label:'self', kw:true},
  ];
  const strip = document.getElementById('symstrip');
  symbols.forEach(s => {
    const b = document.createElement('button');
    b.className = 'sym' + (s.kw ? ' kw' : '');
    b.textContent = s.label;
    b.addEventListener('click', () => insertAtCursor(s.insert !== undefined ? s.insert : s.label, s.label));
    strip.appendChild(b);
  });

  function insertAtCursor(text, label){
    const start = codeEl.selectionStart, end = codeEl.selectionEnd;
    const val = codeEl.value;
    let insert = text, caretOffset = text.length;
    // smart-close pairs: place cursor between the pair
    if (label === '()' || label === '[]' || label === '{}' || label === '""' || label === "''"){
      caretOffset = 1;
    }
    codeEl.value = val.slice(0, start) + insert + val.slice(end);
    codeEl.selectionStart = codeEl.selectionEnd = start + caretOffset;
    codeEl.focus();
    syncGutter();
    scheduleSave();
  }

  // ---------- Editor behavior: tab / auto-indent ----------
  codeEl.addEventListener('keydown', (e) => {
    if (e.key === 'Tab'){
      e.preventDefault();
      const start = codeEl.selectionStart, end = codeEl.selectionEnd;
      if (e.shiftKey){
        const before = codeEl.value.slice(0, start);
        const lineStart = before.lastIndexOf('\n') + 1;
        if (codeEl.value.slice(lineStart, lineStart + 4) === '    '){
          codeEl.value = codeEl.value.slice(0, lineStart) + codeEl.value.slice(lineStart + 4);
          codeEl.selectionStart = codeEl.selectionEnd = Math.max(lineStart, start - 4);
        }
      } else {
        codeEl.value = codeEl.value.slice(0, start) + '    ' + codeEl.value.slice(end);
        codeEl.selectionStart = codeEl.selectionEnd = start + 4;
      }
      syncGutter(); scheduleSave();
    } else if (e.key === 'Enter'){
      const start = codeEl.selectionStart;
      const before = codeEl.value.slice(0, start);
      const lineStart = before.lastIndexOf('\n') + 1;
      const line = before.slice(lineStart);
      const indentMatch = line.match(/^[ \t]*/);
      let indent = indentMatch ? indentMatch[0] : '';
      if (line.trim().endsWith(':')) indent += '    ';
      e.preventDefault();
      const end = codeEl.selectionEnd;
      const insert = '\n' + indent;
      codeEl.value = codeEl.value.slice(0, start) + insert + codeEl.value.slice(end);
      codeEl.selectionStart = codeEl.selectionEnd = start + insert.length;
      syncGutter(); scheduleSave();
    }
  });
  codeEl.addEventListener('input', () => { syncGutter(); scheduleSave(); });
  codeEl.addEventListener('scroll', () => { gutterEl.scrollTop = codeEl.scrollTop; });

  function syncGutter(){
    const lines = codeEl.value.split('\n').length;
    let html = '';
    for (let i = 1; i <= lines; i++) html += i + '\n';
    gutterEl.textContent = html;
  }

  // ---------- Persistence ----------
  let saveTimer = null;
  function scheduleSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try { await window.storage.set('code:main', codeEl.value); } catch(e){ /* storage unavailable */ }
    }, 700);
  }
  async function loadSaved(){
    try {
      const res = await window.storage.get('code:main');
      if (res && typeof res.value === 'string' && res.value.length) return res.value;
    } catch(e){ /* no saved code yet */ }
    return STARTER;
  }

  // ---------- Tabs ----------
  function showPane(which){
    document.getElementById('paneCode').classList.toggle('active', which === 'code');
    document.getElementById('paneOutput').classList.toggle('active', which === 'output');
    document.getElementById('tabCodeBtn').classList.toggle('active', which === 'code');
    document.getElementById('tabOutputBtn').classList.toggle('active', which === 'output');
    if (which === 'output') { outBadge.style.display = 'none'; }
  }

  // ---------- Output rendering ----------
  function appendOutput(text, cls){
    const placeholder = outputEl.querySelector('.placeholder');
    if (placeholder) placeholder.remove();
    if (!text) return;
    const div = document.createElement('div');
    div.className = 'line ' + cls;
    div.textContent = text;
    outputEl.appendChild(div);
    outputEl.scrollTop = outputEl.scrollHeight;
  }
  function appendMeta(text){
    const div = document.createElement('div');
    div.className = 'meta';
    div.textContent = text;
    outputEl.appendChild(div);
    outputEl.scrollTop = outputEl.scrollHeight;
  }
  function flagOutputTab(isError){
    if (!document.getElementById('paneOutput').classList.contains('active')){
      outBadge.style.display = isError ? 'inline-block' : 'none';
    }
  }

  // ---------- Pyodide setup ----------
  let pyodide = null;
  let ready = false;

  function setStatus(state, label){
    statusDot.className = 'dot ' + state;
    statusText.textContent = label;
  }

  async function boot(){
    setStatus('booting', 'booting runtime');
    try {
      pyodide = await loadPyodide({ indexURL: 'https://cdnjs.cloudflare.com/ajax/libs/pyodide/0.28.3/' });
      pyodide.setStdout({ batched: (s) => appendOutput(s, 'stdout') });
      pyodide.setStderr({ batched: (s) => appendOutput(s, 'stderr') });
      ready = true;
      setStatus('ready', 'ready');
      runBtn.disabled = false;
      runLabel.textContent = 'Run';
    } catch(err){
      setStatus('err', 'failed to load');
      runLabel.textContent = 'Unavailable';
      appendMeta('Runtime failed to load: ' + err);
    }
  }

  async function runCode(){
    if (!ready) return;
    showPane('output');
    scheduleSave();
    runBtn.disabled = true;
    runSpinner.classList.add('on');
    runLabel.textContent = 'Running…';
    setStatus('running', 'running');
    appendMeta('— run started ' + new Date().toLocaleTimeString() + ' —');
    const t0 = performance.now();
    try {
      await pyodide.runPythonAsync(codeEl.value);
      const ms = Math.round(performance.now() - t0);
      appendMeta('finished in ' + ms + 'ms');
      flagOutputTab(false);
    } catch (err){
      appendOutput(String(err.message || err), 'stderr');
      flagOutputTab(true);
    } finally {
      runBtn.disabled = false;
      runSpinner.classList.remove('on');
      runLabel.textContent = 'Run';
      setStatus('ready', 'ready');
    }
  }

  runBtn.addEventListener('click', runCode);
  document.getElementById('clearBtn').addEventListener('click', () => {
    outputEl.innerHTML = '<div class="placeholder">Run your code to see output here.</div>';
    outBadge.style.display = 'none';
  });
  document.getElementById('resetBtn').addEventListener('click', () => {
    if (confirm('Reset editor to the starter example? This replaces your current code.')){
      codeEl.value = STARTER;
      syncGutter();
      scheduleSave();
    }
  });

  // ---------- Init ----------
  (async function init(){
    codeEl.value = await loadSaved();
    syncGutter();
    boot();
  })();
</script>
</body>
</html>
